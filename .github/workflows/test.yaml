name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  PGL_VERSION: 2.0.0-beta.4

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh

  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./
        with:
          version: ${{ env.PGL_VERSION }}
      - name: The binary runs and reports the requested version
        run: |
          pglifecycle --version
          test "$(pglifecycle --version)" = "pglifecycle ${PGL_VERSION}"
          test "${{ steps.setup.outputs.version }}" = "${PGL_VERSION}"
      - id: latest
        uses: ./
      - name: latest installs a release that runs
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          BINARY: ${{ steps.latest.outputs.path }}
        run: |
          test -n "$VERSION"
          test "$("$BINARY" --version)" = "pglifecycle $VERSION"

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      # The runner ships older PostgreSQL client tools and pg_dump refuses
      # to read a newer server, so add the PGDG repository and put the 18
      # client first on PATH.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - uses: ./
        with:
          version: ${{ env.PGL_VERSION }}
      - name: pg_dump matches the server major version
        run: pg_dump --version | grep -q ' 18\.'
      - name: Create a schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_read NOLOGIN;
          CREATE SCHEMA app;
          CREATE TABLE app.account (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            email text NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now());
          CREATE INDEX account_created_at ON app.account (created_at);
          CREATE VIEW app.recent AS
            SELECT id, email FROM app.account
             WHERE created_at > now() - interval '1 day';
          CREATE FUNCTION app.normalize(text) RETURNS text
            LANGUAGE sql IMMUTABLE AS $$ SELECT lower(trim($1)) $$;
          GRANT USAGE ON SCHEMA app TO app_read;
          GRANT SELECT ON ALL TABLES IN SCHEMA app TO app_read;
          SQL
      - name: Pull the database into a project
        run: pglifecycle pull ./schema

      # A project that pull wrote gives an empty plan for its database.
      - id: plan
        uses: ./deploy
        with:
          version: ${{ env.PGL_VERSION }}
          project: ./schema
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
          host: localhost
          username: postgres
          password: postgres
          database: postgres
      - name: The plan is empty and the outputs are set
        run: |
          head -1 "${{ steps.plan.outputs.plan }}" | grep -q '^-- pglifecycle deploy$'
          test "${{ steps.plan.outputs.drift }}" = false
          test "${{ steps.plan.outputs.excluded }}" = 0

      # An object that exists only in the database is a change, and
      # dropping it is destructive, so this plan always reports drift.
      - name: Drift the database
        run: psql -c 'CREATE TABLE app.drifted (id int)'
      - id: drifted
        continue-on-error: true
        uses: ./deploy
        with:
          version: ${{ env.PGL_VERSION }}
          project: ./schema
          output: drifted.sql
          fail-on-drift: true
          host: localhost
          username: postgres
          password: postgres
          database: postgres
      - name: fail-on-drift failed the step
        run: |
          test "${{ steps.drifted.outcome }}" = failure
          test "${{ steps.drifted.outputs.drift }}" = true
          test "${{ steps.drifted.outputs.excluded }}" = 1
